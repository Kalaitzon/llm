# /etc/nginx/sites-available/app.nexora.conf
# Managed by config management. nginx 1.18.0 (Ubuntu)

upstream app_backend {
    server 127.0.0.1:8000 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    server_name app.nexora.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.nexora.internal;

    ssl_certificate     /etc/ssl/nexora/app.nexora.internal.crt;
    ssl_certificate_key /etc/ssl/nexora/app.nexora.internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log warn;

    client_max_body_size 25m;

    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/app/public/;
        expires 7d;
        access_log off;
    }

    # Internal metrics: restricted to the corporate subnet only
    location /metrics {
        allow 10.20.0.0/16;
        deny  all;
        proxy_pass http://app_backend;
    }
}
